name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out DrawMCP
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Check generated WebMCP eval schemas
        run: npm run evals:check

      - name: Deterministic WebMCP browser proof
        run: npm run evals:deterministic

      - name: Build
        run: npm run build
